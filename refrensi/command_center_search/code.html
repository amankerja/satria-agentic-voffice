<!DOCTYPE html>

<style>
        body { font-family: system-ui, sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for clean technical look but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex items-center justify-center relative">
<!-- Simulated background dashboard context -->
<div class="absolute inset-0 z-0 opacity-30 flex gap-4 p-8 pointer-events-none">
<div class="w-64 h-full border-r border-outline-variant flex flex-col gap-4 pr-4">
<div class="w-full h-8 bg-surface-container rounded"></div>
<div class="w-3/4 h-4 bg-surface-container rounded mt-8"></div>
<div class="w-1/2 h-4 bg-surface-container rounded"></div>
<div class="w-full h-4 bg-surface-container rounded"></div>
</div>
<div class="flex-1 flex flex-col gap-4">
<div class="w-full h-12 bg-surface-container rounded"></div>
<div class="flex-1 flex gap-4">
<div class="flex-1 bg-surface-container rounded border border-outline-variant"></div>
<div class="w-1/3 bg-surface-container rounded border border-outline-variant"></div>
</div>
</div>
</div>
<!-- Backdrop Blur for Command Palette Focus -->
<div class="absolute inset-0 bg-surface/60 backdrop-blur-md z-40"></div>
<!-- Command Palette Modal (Semantic Shell rules applied: No standard navs, focused canvas) -->
<div class="relative z-50 w-full max-w-2xl bg-surface-container shadow-2xl rounded-xl border border-outline-variant flex flex-col mx-4 overflow-hidden" style="max-height: 85vh;">
<!-- Search Input Header -->
<div class="flex items-center px-lg py-md border-b border-outline-variant gap-md bg-surface-container-high">
<span class="material-symbols-outlined text-primary text-[20px]">search</span>
<input autofocus="" class="w-full bg-transparent border-none outline-none focus:ring-0 text-on-surface font-body-lg text-body-lg placeholder:text-on-surface-variant/50 caret-primary" placeholder="Search workspace..." type="text"/>
<div class="hidden sm:flex items-center justify-center bg-surface border border-outline-variant rounded px-sm py-xs font-mono text-[10px] text-on-surface-variant">
                ESC
            </div>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto no-scrollbar p-md flex flex-col gap-lg">
<!-- Quick Commands Section -->
<div class="flex flex-col gap-xs">
<div class="font-label text-label text-on-surface-variant px-sm mb-xs uppercase tracking-wider">Quick Commands</div>
<button class="w-full text-left flex items-center justify-between px-md py-sm rounded border border-transparent hover:bg-surface-container-highest hover:border-outline-variant transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary text-[18px]">add_task</span>
<span class="font-body-sm text-body-sm text-on-surface">Create task</span>
</div>
<div class="hidden group-hover:flex items-center gap-xs font-mono text-caption text-on-surface-variant">
<span class="bg-surface border border-outline-variant px-1 rounded text-[10px]">T</span>
</div>
</button>
<button class="w-full text-left flex items-center justify-between px-md py-sm rounded border border-transparent hover:bg-surface-container-highest hover:border-outline-variant transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary text-[18px]">folder_open</span>
<span class="font-body-sm text-body-sm text-on-surface">Create project</span>
</div>
<div class="hidden group-hover:flex items-center gap-xs font-mono text-caption text-on-surface-variant">
<span class="bg-surface border border-outline-variant px-1 rounded text-[10px]">P</span>
</div>
</button>
<button class="w-full text-left flex items-center justify-between px-md py-sm rounded border border-transparent hover:bg-surface-container-highest hover:border-outline-variant transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-secondary text-[18px]">swap_horiz</span>
<span class="font-body-sm text-body-sm text-on-surface">Switch workspace</span>
</div>
<div class="hidden group-hover:flex items-center gap-xs font-mono text-caption text-on-surface-variant">
<span class="bg-surface border border-outline-variant px-1 rounded text-[10px]">W</span>
</div>
</button>
</div>
<!-- Recent Projects Section -->
<div class="flex flex-col gap-xs">
<div class="font-label text-label text-on-surface-variant px-sm mb-xs uppercase tracking-wider">Projects</div>
<button class="w-full text-left flex items-center justify-between px-md py-sm rounded border border-transparent hover:bg-surface-container-highest hover:border-outline-variant transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">account_tree</span>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface">Alpha Core Upgrade</span>
<span class="font-caption text-caption text-on-surface-variant flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container inline-block"></span> Active
                            </span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-0 group-hover:opacity-100 text-[16px] transition-opacity">subdirectory_arrow_left</span>
</button>
<button class="w-full text-left flex items-center justify-between px-md py-sm rounded border border-transparent hover:bg-surface-container-highest hover:border-outline-variant transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">account_tree</span>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface">Beta Analytics Pipeline</span>
<span class="font-caption text-caption text-on-surface-variant flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-surface-variant inline-block"></span> Paused
                            </span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-0 group-hover:opacity-100 text-[16px] transition-opacity">subdirectory_arrow_left</span>
</button>
</div>
<!-- Recent Tasks Section -->
<div class="flex flex-col gap-xs">
<div class="font-label text-label text-on-surface-variant px-sm mb-xs uppercase tracking-wider">Tasks</div>
<button class="w-full text-left flex items-center justify-between px-md py-sm rounded bg-surface-container-highest border border-primary/20 relative overflow-hidden group">
<div class="absolute left-0 top-0 bottom-0 w-0.5 bg-primary"></div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary text-[18px]">check_circle</span>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-primary">Resolve latency spike in region EU-Central</span>
<span class="font-caption text-caption text-on-surface-variant">SYS-4921 • Due Today</span>
</div>
</div>
<div class="flex items-center gap-sm">
<span class="bg-error-container/20 text-error px-1.5 py-0.5 rounded text-[10px] font-mono border border-error-container/30">P1</span>
<span class="material-symbols-outlined text-on-surface-variant opacity-0 group-hover:opacity-100 text-[16px] transition-opacity">subdirectory_arrow_left</span>
</div>
</button>
<button class="w-full text-left flex items-center justify-between px-md py-sm rounded border border-transparent hover:bg-surface-container-highest hover:border-outline-variant transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">radio_button_unchecked</span>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface">Update security certificates for Auth Service</span>
<span class="font-caption text-caption text-on-surface-variant">SEC-1102 • Due Tomorrow</span>
</div>
</div>
<div class="flex items-center gap-sm">
<span class="bg-surface-variant text-on-surface px-1.5 py-0.5 rounded text-[10px] font-mono border border-outline-variant">P3</span>
<span class="material-symbols-outlined text-on-surface-variant opacity-0 group-hover:opacity-100 text-[16px] transition-opacity">subdirectory_arrow_left</span>
</div>
</button>
</div>
<!-- Recent Files Section -->
<div class="flex flex-col gap-xs">
<div class="font-label text-label text-on-surface-variant px-sm mb-xs uppercase tracking-wider">Files &amp; Pages</div>
<button class="w-full text-left flex items-center justify-between px-md py-sm rounded border border-transparent hover:bg-surface-container-highest hover:border-outline-variant transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-secondary text-[18px]">description</span>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface">Q3 Architecture Review.md</span>
<span class="font-caption text-caption text-on-surface-variant">in /docs/architecture</span>
</div>
</div>
<span class="font-caption text-caption text-on-surface-variant">12 KB</span>
</button>
<button class="w-full text-left flex items-center justify-between px-md py-sm rounded border border-transparent hover:bg-surface-container-highest hover:border-outline-variant transition-colors group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">article</span>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface">Incident Report: Database Failover</span>
<span class="font-caption text-caption text-on-surface-variant">Wiki &gt; Operations</span>
</div>
</div>
<span class="font-caption text-caption text-on-surface-variant">Viewed 1h ago</span>
</button>
</div>
<!-- Bottom padding for scroll area -->
<div class="h-2"></div>
</div>
<!-- Footer / Command Hints -->
<div class="flex items-center px-lg py-sm border-t border-outline-variant bg-surface-container-low justify-between shrink-0">
<div class="flex items-center gap-lg font-caption text-caption text-on-surface-variant">
<div class="flex items-center gap-xs">
<span class="flex items-center justify-center bg-surface border border-outline-variant rounded px-1 min-w-[20px] font-mono text-[10px]">↑</span>
<span class="flex items-center justify-center bg-surface border border-outline-variant rounded px-1 min-w-[20px] font-mono text-[10px]">↓</span>
<span class="ml-1">Navigate</span>
</div>
<div class="flex items-center gap-xs">
<span class="flex items-center justify-center bg-surface border border-outline-variant rounded px-1 min-w-[24px] font-mono text-[10px]">↵</span>
<span class="ml-1">Open</span>
</div>
</div>
<div class="font-mono text-[10px] text-outline">SATRIA CMD v2.4</div>
</div>
</div>
