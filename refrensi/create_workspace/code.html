<!DOCTYPE html>

                      "surface-container-low": "#161d19",

                      "secondary-fixed": "#acedff",
                      "primary-fixed": "#6ffbbe",
                      "on-tertiary-container": "#711419",
                      "on-tertiary-fixed": "#410005",

              "borderRadius": {

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom Scrollbar for inner areas if needed */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.surface-container-lowest'); 
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.outline-variant'); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.outline'); 
        }
        
        .glass-panel {
            background: rgba(36, 44, 39, 0.6); /* surface-container-high with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-md md:p-xl relative overflow-hidden">
<!-- Background Pattern/Atmosphere -->
<div class="absolute inset-0 pointer-events-none z-0">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-high/40 via-background to-background"></div>
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
</div>
<!-- Wizard Modal Container -->
<div class="w-full max-w-5xl bg-surface border border-outline-variant rounded-xl shadow-2xl relative z-10 flex flex-col md:flex-row overflow-hidden h-[870px] md:h-auto md:min-h-[600px]">
<!-- Left Side: Form Area -->
<div class="w-full md:w-3/5 flex flex-col h-full bg-surface">
<!-- Header -->
<div class="px-xl py-lg border-b border-outline-variant flex items-center justify-between">
<div>
<h1 class="font-h2 text-h2 text-on-surface mb-xs">Create New Workspace</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Configure your technical command environment.</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors rounded p-sm">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Form Content (Scrollable) -->
<div class="flex-1 overflow-y-auto p-xl space-y-xl">
<!-- Workspace Name -->
<div class="space-y-sm">
<label class="block font-label text-label text-on-surface-variant" for="workspaceName">Workspace Name</label>
<input class="w-full bg-surface-container border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-sm text-body-sm px-md py-sm transition-colors outline-none placeholder:text-on-surface-variant/50" id="workspaceName" placeholder="e.g., Alpha Operations" type="text" value="Project Nova"/>
</div>
<!-- Workspace Type -->
<div class="space-y-sm">
<label class="block font-label text-label text-on-surface-variant mb-md">Environment Type</label>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-md">
<!-- Type: Personal -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="workspaceType" type="radio" value="personal"/>
<div class="border border-outline-variant rounded-lg p-md bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-container/10 transition-all h-full flex flex-col hover:border-outline">
<div class="flex items-center justify-between mb-sm">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface peer-checked:text-primary transition-colors" data-icon="person">person</span>
<div class="w-4 h-4 rounded-full border border-outline-variant peer-checked:border-primary peer-checked:border-[4px] transition-all"></div>
</div>
<span class="font-h3 text-h3 text-on-surface block mb-xs">Personal</span>
<span class="font-caption text-caption text-on-surface-variant">Isolated sandbox environment.</span>
</div>
</label>
<!-- Type: Development -->
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="workspaceType" type="radio" value="development"/>
<div class="border border-outline-variant rounded-lg p-md bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-container/10 transition-all h-full flex flex-col hover:border-outline">
<div class="flex items-center justify-between mb-sm">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface peer-checked:text-primary transition-colors" data-icon="code">code</span>
<div class="w-4 h-4 rounded-full border border-outline-variant peer-checked:border-primary peer-checked:border-[4px] transition-all"></div>
</div>
<span class="font-h3 text-h3 text-on-surface block mb-xs">Development</span>
<span class="font-caption text-caption text-on-surface-variant">Staging and testing area.</span>
</div>
</label>
<!-- Type: Business -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="workspaceType" type="radio" value="business"/>
<div class="border border-outline-variant rounded-lg p-md bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-container/10 transition-all h-full flex flex-col hover:border-outline">
<div class="flex items-center justify-between mb-sm">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface peer-checked:text-primary transition-colors" data-icon="domain">domain</span>
<div class="w-4 h-4 rounded-full border border-outline-variant peer-checked:border-primary peer-checked:border-[4px] transition-all"></div>
</div>
<span class="font-h3 text-h3 text-on-surface block mb-xs">Production</span>
<span class="font-caption text-caption text-on-surface-variant">Live collaborative deployment.</span>
</div>
</label>
</div>
</div>
<!-- Icon Picker -->
<div class="space-y-sm">
<label class="block font-label text-label text-on-surface-variant">Workspace Icon</label>
<div class="flex gap-md flex-wrap">
<button class="w-12 h-12 rounded border border-primary bg-primary-container/10 text-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined icon-fill" data-icon="rocket_launch">rocket_launch</span>
</button>
<button class="w-12 h-12 rounded border border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-outline text-on-surface-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="hub">hub</span>
</button>
<button class="w-12 h-12 rounded border border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-outline text-on-surface-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="memory">memory</span>
</button>
<button class="w-12 h-12 rounded border border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-outline text-on-surface-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="data_usage">data_usage</span>
</button>
<button class="w-12 h-12 rounded border border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-outline text-on-surface-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="account_tree">account_tree</span>
</button>
<button class="w-12 h-12 rounded border border-outline-variant border-dashed bg-surface hover:bg-surface-container-high hover:border-outline text-on-surface-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Description -->
<div class="space-y-sm pb-md">
<label class="block font-label text-label text-on-surface-variant" for="workspaceDesc">Description (Optional)</label>
<textarea class="w-full bg-surface-container border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-sm text-body-sm px-md py-sm transition-colors outline-none resize-none placeholder:text-on-surface-variant/50" id="workspaceDesc" placeholder="Brief details about this workspace's purpose..." rows="3">Primary environment for testing new deployment pipelines and managing container orchestration before production release.</textarea>
</div>
</div>
<!-- Footer Actions -->
<div class="p-xl border-t border-outline-variant bg-surface flex justify-end gap-md mt-auto">
<button class="px-lg py-sm font-label text-label text-on-surface-variant hover:text-on-surface border border-outline-variant hover:border-outline rounded transition-colors bg-transparent">
                    Cancel
                </button>
<button class="px-lg py-sm font-label text-label text-on-primary bg-primary hover:bg-primary-fixed rounded transition-colors flex items-center gap-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="check">check</span>
                    Create Workspace
                </button>
</div>
</div>
<!-- Right Side: Live Preview -->
<div class="hidden md:flex w-2/5 bg-surface-container-lowest border-l border-outline-variant flex-col relative overflow-hidden">
<!-- Subtle grid background for preview area -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(theme('colors.on-surface') 1px, transparent 1px); background-size: 16px 16px;"></div>
<div class="p-xl border-b border-outline-variant relative z-10 flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="visibility">visibility</span>
<span class="font-label text-label text-on-surface-variant uppercase tracking-wider">Live Preview</span>
</div>
<div class="flex-1 p-xl flex items-center justify-center relative z-10">
<!-- Preview Card -->
<div class="w-full max-w-sm glass-panel border border-outline-variant rounded-lg p-lg shadow-lg">
<div class="flex items-start justify-between mb-xl">
<div class="w-12 h-12 rounded bg-primary-container/20 border border-primary/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined icon-fill" data-icon="rocket_launch">rocket_launch</span>
</div>
<div class="flex items-center gap-xs px-sm py-[2px] bg-surface-container border border-outline-variant rounded-full">
<div class="w-2 h-2 rounded-full bg-secondary"></div>
<span class="font-caption text-caption text-on-surface-variant uppercase tracking-wide">Development</span>
</div>
</div>
<h3 class="font-h2 text-h2 text-on-surface mb-xs" id="previewTitle">Project Nova</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-3 mb-xl" id="previewDesc">Primary environment for testing new deployment pipelines and managing container orchestration before production release.</p>
<div class="pt-md border-t border-outline-variant flex items-center justify-between">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="group">group</span>
<span class="font-mono text-mono">1 Member</span>
</div>
<div class="font-mono text-mono text-on-surface-variant flex items-center gap-xs">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
                             Status: Provisioning
                         </div>
</div>
</div>
</div>
</div>
</div>
<!-- Simple script to handle preview updates for demonstration -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('workspaceName');
            const descInput = document.getElementById('workspaceDesc');
            const previewTitle = document.getElementById('previewTitle');
            const previewDesc = document.getElementById('previewDesc');

            nameInput.addEventListener('input', (e) => {
                previewTitle.textContent = e.target.value || 'Workspace Name';
            });

            descInput.addEventListener('input', (e) => {
                previewDesc.textContent = e.target.value || 'Workspace description will appear here...';
            });
        });
    </script>
</body></html>
